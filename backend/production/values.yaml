# Cosmopod Mender Open Source production template.
# Chart: mender/mender 7.7.4. Server image release tag: v4.1.1.
# This file contains references only. Create secrets through an external
# secret manager before use.

global:
  enterprise: false
  hosted: false
  mongodb:
    existingSecret: cosmopod-mender-mongodb
    URL: ""
  nats:
    existingSecret: cosmopod-mender-nats
    URL: ""
  smtp:
    existingSecret: cosmopod-mender-smtp
  storage: aws
  s3:
    existingSecret: cosmopod-mender-s3
    AWS_SERVICE_ACCOUNT_NAME: ""
  url: https://kys.dpdns.org

default:
  image:
    registry: docker.io
    repository: mendersoftware
    tag: v4.1.1
    pullPolicy: IfNotPresent
  hpa:
    enabled: false
  pdb:
    enabled: true
    minAvailable: 1

serviceAccount:
  create: true
  name: ""

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  path: /
  hosts:
    - kys.dpdns.org
  tls:
    - secretName: mender-ingress-tls
      hosts:
        - kys.dpdns.org

# Built-in MongoDB is explicitly unsuitable for production.
mongodb:
  enabled: false

# Redis is an Enterprise-only dependency in this pinned chart; Open Source
# workloads do not consume it. Keep the convenience subchart disabled.
redis:
  enabled: false

# Production NATS is external, authenticated, persistent, monitored, and
# supplied through cosmopod-mender-nats. The convenience subchart is disabled.
nats:
  enabled: false

api_gateway:
  dashboard: false
  replicas: 2
  env:
    SSL: false
  service:
    type: ClusterIP
  storage_proxy:
    enabled: false

deployments:
  replicas: 2
  directUpload:
    enabled: false
    skipVerify: false

device_auth:
  replicas: 2
  certs:
    existingSecret: cosmopod-mender-deviceauth-signing

inventory:
  replicas: 2

useradm:
  replicas: 2
  certs:
    existingSecret: cosmopod-mender-useradm-signing

workflows:
  replicas: 2
  nats:
    replicas: 3

gui:
  replicas: 2

tests:
  enabled: true
