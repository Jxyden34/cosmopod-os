header:
  version: 14

build_system: openembedded
distro: cosmopod
target:
  - cosmopod-image

# Optional user-local host locale for builders without administrator access.
env:
  LOCPATH: null

repos:
  cosmopod-os:
    layers:
      meta-cosmopod:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core.git
    commit: 636e5d3b12d54951c13d57346648bc29a0e6b24e
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake.git
    commit: 6e260eb6ab1631607ea414d9ff8ede1155faa5d9
    layers:
      bitbake: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto.git
    commit: 7c25b11156553145fa6b241a2d4f65d94438f804
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded.git
    commit: f28a144aa0a0ae05ca2ee91e1aef6aa05f6a12db
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-multimedia:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d

  meta-mender:
    url: https://github.com/mendersoftware/meta-mender.git
    commit: af44bda9237dfbdb09a6c6988ebfcb2486d1ea7d
    layers:
      meta-mender-core:

  meta-mender-community:
    url: https://github.com/theyoctojester/meta-mender-community.git
    commit: f6860e099fe97260612380dd0092e854831bd9c0
    layers:
      meta-mender-raspberrypi:

local_conf_header:
  cosmopod-base: |
    CONF_VERSION = "2"
    INIT_MANAGER = "systemd"
    PACKAGE_CLASSES = "package_ipk"
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

    OE_FRAGMENTS += "core/yocto/sbom-cve-check"
    INHERIT += "cosmopod-task-network-compat"
    SPDX_INCLUDE_SOURCES = "0"
    SPDX_ARCHIVE_PACKAGED = "0"
    SPDX_PRETTY = "1"
    COPY_LIC_MANIFEST = "1"
    COPY_LIC_DIRS = "1"
    # Keep complete JSON/SPDX evidence, but do not emit the entire kernel CVE
    # set as one console line. That exceeds KAS/Python's stream line limit.
    SBOM_CVE_CHECK_SHOW_WARNINGS = "0"
    include conf/distro/include/cve-extra-exclusions.inc
    ARTIFACTIMG_FSTYPE = "ext4"
    MENDER_STORAGE_TOTAL_SIZE_MB = "7450"
    MENDER_BOOT_PART_SIZE_MB = "256"
    MENDER_DATA_PART_SIZE_MB = "1024"

    COSMOPOD_VERSION ?= "0.77.0-dev"
    MENDER_ARTIFACT_NAME ?= "cosmopod-os-${COSMOPOD_VERSION}-${MACHINE}"
    # Standalone installation uses signed public release files, not a backend.
    MENDER_SERVER_URL = ""
    MENDER_TENANT_TOKEN = ""
    SYSTEMD_AUTO_ENABLE:pn-mender = "disable"
    PACKAGECONFIG:remove:pn-openssh = "systemd-sshd-socket-mode"
    PACKAGECONFIG:append:pn-openssh = " systemd-sshd-service-mode"

    # Keep NFS client tools available without exposing server/RPC daemons on
    # every fresh install. Operators can enable them deliberately if needed.
    SYSTEMD_AUTO_ENABLE:pn-nfs-utils = "disable"
    SYSTEMD_AUTO_ENABLE:pn-rpcbind = "disable"

    # Do not migrate an old managed endpoint into newly built configuration.
    MENDER_PERSISTENT_CONFIGURATION_VARS:remove = "ServerURL TenantToken"

    # Factory image includes one FAT boot partition, two rootfs slots, and data.
    IMAGE_FSTYPES:remove = "rpi-sdimg"
    IMAGE_ROOTFS_EXTRA_SPACE = "524288"

    RPI_USE_U_BOOT = "1"
    ENABLE_UART = "1"
    ENABLE_I2C = "1"
    ENABLE_SPI_BUS = "1"
    VC4DTBO = "vc4-kms-v3d"
    DISABLE_OVERSCAN = "1"
    GPU_MEM = "128"
    MENDER_BOOT_PART_SIZE_MB = "256"
    IMAGE_INSTALL:append = " kernel-image"
