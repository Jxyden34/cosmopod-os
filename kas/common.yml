header:
  version: 14

build_system: openembedded
distro: cosmopod
target:
  - cosmopod-image

repos:
  cosmopod-os:
    layers:
      meta-cosmopod:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core.git
    commit: 543550522f831479f07d332a40ba343c53ae1065
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake.git
    commit: cff3be6f664f8f07a40727ff63eeeb24d6f5e00b
    layers:
      bitbake: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto.git
    commit: 2f749ae477c3b94dce71038f025180d7f612dab0
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded.git
    commit: ef3df29f2cfca6a9513b51ebcdccf82b6c8a836f
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-multimedia:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    commit: 6ca1f75017cc5d5acdb8bb05634c4bc01fa049fd

  meta-mender:
    url: https://github.com/mendersoftware/meta-mender.git
    commit: 00d4dfc36625a27ca0d6ad7aa33eeeab397281a9
    layers:
      meta-mender-core:

  meta-mender-community:
    url: https://github.com/theyoctojester/meta-mender-community.git
    commit: bc815f010f3b6c2180c2acb2b632bdcc9ff992c6
    layers:
      meta-mender-raspberrypi:

local_conf_header:
  cosmopod-base: |
    CONF_VERSION = "2"
    INIT_MANAGER = "systemd"
    PACKAGE_CLASSES = "package_ipk"
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

    INHERIT += "create-spdx cve-check"
    SPDX_INCLUDE_SOURCES = "0"
    SPDX_ARCHIVE_PACKAGED = "0"
    SPDX_PRETTY = "1"
    COPY_LIC_MANIFEST = "1"
    COPY_LIC_DIRS = "1"
    CVE_CHECK_CREATE_MANIFEST = "1"
    CVE_CHECK_MANIFEST_JSON_SUFFIX = "cve.json"
    CVE_CHECK_REPORT_PATCHED = "1"
    # Keep complete text/JSON evidence, but do not emit the entire kernel CVE
    # set as one console line.  That exceeds KAS/Python's stream line limit.
    CVE_CHECK_SHOW_WARNINGS = "0"
    CVE_DB_UPDATE_INTERVAL = "0"
    include conf/distro/include/cve-extra-exclusions.inc
    PREFERRED_VERSION_linux-raspberrypi = "6.12.%"
    ARTIFACTIMG_FSTYPE = "ext4"
    MENDER_STORAGE_TOTAL_SIZE_MB = "7450"
    MENDER_BOOT_PART_SIZE_MB = "256"
    MENDER_DATA_PART_SIZE_MB = "1024"

    COSMOPOD_VERSION ?= "0.43.0-dev"
    MENDER_ARTIFACT_NAME ?= "cosmopod-os-${COSMOPOD_VERSION}-${MACHINE}"
    MENDER_SERVER_URL ?= "https://kys.dpdns.org"
    MENDER_TENANT_TOKEN ?= ""
    MENDER_UPDATE_POLL_INTERVAL_SECONDS = "1800"
    MENDER_INVENTORY_POLL_INTERVAL_SECONDS = "28800"
    PACKAGECONFIG:remove:pn-openssh = "systemd-sshd-socket-mode"
    PACKAGECONFIG:append:pn-openssh = " systemd-sshd-service-mode"

    # Keep NFS client tools available without exposing server/RPC daemons on
    # every fresh install. Operators can enable them deliberately if needed.
    SYSTEMD_AUTO_ENABLE:pn-nfs-utils = "disable"
    SYSTEMD_AUTO_ENABLE:pn-rpcbind = "disable"

    # Preserve backend selection across A/B rootfs replacement.
    MENDER_CONFIGURATION_VARS:append = " TenantToken"
    MENDER_PERSISTENT_CONFIGURATION_VARS:append = " ServerURL TenantToken"

    # Factory image includes one FAT boot partition, two rootfs slots, and data.
    IMAGE_FSTYPES:remove = "rpi-sdimg"
    IMAGE_ROOTFS_EXTRA_SPACE = "524288"

    RPI_USE_U_BOOT = "1"
    ENABLE_UART = "1"
    ENABLE_I2C = "1"
    ENABLE_SPI_BUS = "1"
    VC4DTBO = "vc4-kms-v3d"
    DISABLE_OVERSCAN = "1"
    GPU_MEM = "128"
    MENDER_BOOT_PART_SIZE_MB = "256"
    IMAGE_INSTALL:append = " kernel-image"
