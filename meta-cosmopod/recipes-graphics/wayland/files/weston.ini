[core]
shell=desktop-shell.so
idle-time=0
require-input=false

[shell]
background-color=0xff090d1a
background-image=/usr/share/backgrounds/cosmopod-logo.png
background-type=scale
panel-color=0xe61a2033
locking=false
clock-format=minutes-24h
animation=fade
startup-animation=fade
binding-modifier=super

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal

[libinput]
enable-tap=true
