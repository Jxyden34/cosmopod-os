require conf/distro/poky.conf

DISTRO = "cosmopod"
DISTROOVERRIDES = "poky:cosmopod"
DISTRO_NAME = "Cosmopod OS"
DISTRO_VERSION = "${COSMOPOD_VERSION}"
DISTRO_CODENAME = "launchpad"
SDK_VENDOR = "-cosmopod"

DISTRO_FEATURES:append = " systemd pam polkit wayland opengl usrmerge ipv6 wifi bluetooth"
DISTRO_FEATURES:remove = " x11 sysvinit"

VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager = "shadow-base"

SYSTEMD_DEFAULT_TARGET = "graphical.target"
PREFERRED_PROVIDER_virtual/ssh = "openssh"

# Rootfs changes are released as tested A/B artifacts, not live package feeds.
EXTRA_IMAGE_FEATURES = ""
